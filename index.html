<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Bonwire Kente - Buy authentic Ghanaian Kente cloth, fabrics and custom-printed products online." />
    <title>Bonwire Kente - Authentic Ghanaian Kente Cloth</title>

    <!--
      Content-Security-Policy (applied to the REAL served page via meta tag).
      Notes:
      - 'unsafe-inline' in script-src is REQUIRED by Paystack's inline.js (it
        injects inline scripts for the checkout popup). It cannot be removed
        without breaking card payments. It is the one inline allowance.
      - object-src 'none' / base-uri 'self' / form-action 'self' block plugin,
        base-tag and form-targeting abuse.
      - The Paystack hosts are allow-listed explicitly; all other inline/external
        script is blocked.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://js.paystack.co https://checkout.paystack.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' http://localhost:5000 https://api.paystack.co https://checkout.paystack.com;
      frame-src 'self' https://checkout.paystack.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    ">

    <!-- Preconnect to reduce connection setup latency for Paystack -->
    <link rel="preconnect" href="https://js.paystack.co" crossorigin />

    <!-- ✅ Paystack SDK script - deferred so it never blocks first paint -->
    <script src="https://js.paystack.co/v2/inline.js" defer></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React app entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
