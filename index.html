<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Bonwire Kente - Buy authentic Ghanaian Kente cloth, fabrics and custom-printed products online." />
    <meta name="google-site-verification" content="Ov0QuTmfM2mbS5xggbGHgbHB3G6PymFi767j5gMH7tE" />
    <title>Bonwire Kente - Authentic Ghanaian Kente Cloth</title>

    <!--
      Content-Security-Policy: set by the backend (Helmet) and by vercel.json
      headers at the edge. The meta tag below is removed because it blocked
      cross-origin API calls when the SPA is hosted on Vercel and the API on
      Render — the browser refused any connect-src outside localhost:5000.
      Helmet on the backend sets CSP for API responses; for the static SPA we
      add it via vercel.json so the backend origin can be allow-listed.
    -->

    <!-- Preconnect to reduce connection setup latency for Paystack -->
    <link rel="preconnect" href="https://js.paystack.co" crossorigin />

    <!-- ✅ Paystack SDK script - deferred so it never blocks first paint -->
    <script src="https://js.paystack.co/v2/inline.js" defer></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- React app entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
