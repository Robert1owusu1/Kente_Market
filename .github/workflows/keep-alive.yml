name: keep-alive

on:
  schedule:
    # Every 6 hours — Render's free tier sleeps after ~15 min of inactivity,
    # so pinging the health endpoint keeps the API warm and avoids
    # multi-second cold starts (which show up as slow FCP/LCP and console
    # errors in Lighthouse). Kept to a low burn rate (4 runs/day instead of
    # 120).
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render API health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping kente-api health check
        # Single-line curl (no backslash continuations), no --fail-with-body:
        # the previous multi-line form failed instantly with "exit code 2"
        # (curl's usage-error code) on every scheduled run since 327d3d8, and
        # Action logs need sign-in, so failures are surfaced as annotations
        # (curl exit + HTTP code) that show up on the run page itself.
        # --retry-all-errors + -m 60 rides out Render free-tier cold starts
        # (the sleeping instance keeps waking after a timed-out attempt).
        run: |
          echo "curl $(curl --version | head -1)"
          set +e
          code=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors --retry-max-time 240 -m 60 -o /tmp/health.json -w '%{http_code}' https://kente-api.onrender.com/health 2>/tmp/health.err)
          rc=$?
          set -e
          echo "curl exit=$rc http=$code"
          echo "--- body ---"; cat /tmp/health.json 2>/dev/null || true
          echo "--- stderr ---"; cat /tmp/health.err 2>/dev/null || true
          if [ "$rc" -ne 0 ] || [ -z "$code" ] || [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::kente-api health ping failed (curl exit ${rc}, HTTP ${code:-none}) — see body/stderr above"
            exit 1
          fi
          echo "::notice::kente-api healthy (HTTP $code)"
