name: keep-alive

on:
  schedule:
    # Every 12 minutes, all day, every day — Render's free tier sleeps after
    # ~15 min of inactivity, so pinging the health endpoint keeps the API warm
    # and avoids multi-second cold starts (which show up as slow FCP/LCP and
    # console errors in Lighthouse).
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render API health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping kente-api health check
        run: |-
          curl -fsS --retry 3 --retry-delay 5 -m 30 \
            https://kente-api.onrender.com/health \
            || echo "Health check returned non-200 (server may be cold-starting or down)."