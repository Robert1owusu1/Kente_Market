name: keep-alive

on:
  schedule:
    # Every 6 hours — Render's free tier sleeps after ~15 min of inactivity,
    # so pinging the health endpoint keeps the API warm and avoids
    # multi-second cold starts (which show up as slow FCP/LCP and console
    # errors in Lighthouse). Kept to a low burn rate (4 runs/day instead of
    # 120).
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Render API health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping kente-api health check
        # -f/--fail-with-body: a non-2xx response fails the step, turning the
        # job red when the API is actually down (no `|| echo` escape hatch).
        run: |-
          curl -fsS --retry 3 --retry-delay 5 -m 30 \
            --fail-with-body \
            https://kente-api.onrender.com/health
